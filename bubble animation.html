<style>
  html, body {
width: 100%;
height: 100%;
}

.wrapper {
display: inline-block;
width: 100%;
height: 100%;
background-image: url("	https://glasssuites.com/wp-content/uploads/2024/05/Bannersectionbackgroundimage-ezgif.webp");
background-size: cover;
filter: blur(0px);
overflow: hidden;
}

.circle_container {
position: absolute;
top: 50%;
left: 50%;
height: 10px;
transform-origin: left center;
}
.circle_container .circle {
position: absolute;
border-radius: 100%;
background: rgba(255, 255, 255, 0.3);
left: 0;
opacity: 0;
-webkit-animation-name: move;
        animation-name: move;
-webkit-animation-duration: 20s;
        animation-duration: 20s;
-webkit-animation-iteration-count: infinite;
        animation-iteration-count: infinite;
}

@-webkit-keyframes move {
0% {
  transform: translateX(0px);
  opacity: 0;
}
1% {
  opacity: 1;
}
50% {
  opacity: 0.5;
}
100% {
  transform: translateX(70vmin);
  opacity: 0;
}
}

@keyframes move {
0% {
  transform: translateX(0px);
  opacity: 0;
}
1% {
  opacity: 1;
}
50% {
  opacity: 0.5;
}
100% {
  transform: translateX(70vmin);
  opacity: 0;
}
}
.wrapper .name_container {
position: absolute;
left: 50%;
top: 50%;
transform: translate(-50%, -50%);
width: 80vmin;
height: 80vmin;
background: rgba(255, 255, 255, 0.1);
border-radius: 100%;
box-shadow: inset 0px 0px 30px 30px rgba(200, 200, 200, 0.1);
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
}
.wrapper .name_container > div {
font-family: "Montserrat";
color: rgba(255, 255, 255, 0.7);
}
.wrapper .name_container .name {
font-size: 5.5vmax;
}
.wrapper .name_container .designation {
margin-top: 10px;
font-size: 2vmax;
}
</style>
<div class="wrapper">
<div class="name_container">
  <div class="name">customized &amp; dedicated offices in bangalore</div>
</div>
</div>

<script>
var bubbleLifeTime = 20;
var noOfBubbles = 100;

var wrapper = document.querySelector(".wrapper");
var bubbles = [];

init();

function init() {
var bubble;
for (var i = 0; i < noOfBubbles; i++) {
  bubble = createBubble();
  wrapper.appendChild(bubble);
}
}

function createBubble() {
var circleContainer = document.createElement("div");
circleContainer.classList.add("circle_container");
circleContainer.style.transform =
  "rotate(" + Math.floor(Math.random() * 360) + "deg)";

var circle = createCircle();
circleContainer.appendChild(circle);

return circleContainer;
}

function createCircle() {
var circle = document.createElement("div");
circle.classList.add("circle");
circle.style.animationDelay = Math.random() * bubbleLifeTime + "s";

var side = 5 + Math.floor(Math.random() * 5) + "px";
circle.style.width = side;
circle.style.height = side;

return circle;
}

</script>
